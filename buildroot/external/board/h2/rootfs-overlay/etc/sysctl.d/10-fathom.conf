# Fathom on the H2 (23 MB of RAM, no swap).
#
# Watermark boosting raises the free-memory floor after the allocator meets
# fragmentation (by 150% of the high watermark, here up to 4 MB): with the radio
# streaming, the player was killed for memory with 3.3 MB still free. Off.
vm.watermark_boost_factor = 0

# The player's code runs from the card and is evicted when memory runs short
# (then read back on the next fault, which the audio can hear). Without swap
# the kernel can reclaim only file pages and its caches: have it give up the
# directory and inode caches sooner (twice as readily as by default) rather
# than page cache, the code among it.
vm.vfs_cache_pressure = 200

# Written data waits in RAM until it's on the card and can't be reclaimed
# meanwhile. By default up to 20% of what's reclaimable (with Wi-Fi uploads to
# the network drive, megabytes); here writing to the card starts at 256 KB
# waiting, and whoever writes waits for it at 1 MB.
vm.dirty_background_bytes = 262144
vm.dirty_bytes = 1048576
