# BlueZ (bluetoothd) for Fathom: an audio source that connects to headphones.
[General]
Name = Fathom H2
# Audio/video, portable audio: what the H2 is to headphones
Class = 0x20041c
DiscoverableTimeout = 0
FastConnectable = true
# Bluetooth Classic only: A2DP, AVRCP
ControllerMode = bredr

[Policy]
AutoEnable = true
# keep trying a paired device that drops out (seconds between attempts)
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
