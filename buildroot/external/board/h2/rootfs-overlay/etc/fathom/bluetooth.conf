# BlueZ (bluetoothd) for Fathom: an audio source that connects to headphones.
[General]
Name = Fathom
# Audio/video, portable audio: what the H2 is to headphones
Class = 0x20041c
DiscoverableTimeout = 0
FastConnectable = true
# Bluetooth Classic only: A2DP, AVRCP
ControllerMode = bredr
# Not pairable by itself (BlueZ 5.79's own default; its option to stay
# pairable always was set here, and is left out on purpose): with it on and no
# agent there to ask, anything in range could pair with the H2, nobody
# agreeing. fathom-bt pair turns pairable on for the one pairing the user
# asked for, and off again after it: a pairing needs it on, or BlueZ keeps no
# key for it. Paired headphones connect again without it.

[Policy]
# the controller on as soon as bluetoothd has it (fathom-bt start only asks
# for "power on" itself when it finds it isn't)
AutoEnable = true
# keep trying a paired device that drops out (seconds between attempts)
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
