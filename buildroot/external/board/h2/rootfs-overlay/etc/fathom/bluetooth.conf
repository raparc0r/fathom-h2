# BlueZ (bluetoothd) for Fathom: an audio source that connects to headphones.
[General]
Name = Fathom H2
# Audio/video, portable audio: what the H2 is to headphones
Class = 0x20041c
DiscoverableTimeout = 0
FastConnectable = true
# Bluetooth Classic only: A2DP, AVRCP
ControllerMode = bredr
# Bonding from the start and for good (pairings keep their keys), without
# fathom-bt asking for it at every start; and it stays on after a pairing,
# where BlueZ otherwise turns it off again when bluetoothctl's agent leaves.
# (BlueZ 5.79: src/main.conf, "AlwaysPairable"; the same as "pairable on".)
AlwaysPairable = true

[Policy]
# the controller on as soon as bluetoothd has it (fathom-bt start only asks
# for "power on" itself when it finds it isn't)
AutoEnable = true
# keep trying a paired device that drops out (seconds between attempts)
ReconnectAttempts = 7
ReconnectIntervals = 1,2,4,8,16,32,64
