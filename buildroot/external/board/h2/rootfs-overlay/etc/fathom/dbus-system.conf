<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- The system bus for Bluetooth (fathom-bt): everything on the H2 runs as
     root, and only BlueZ, bluez-alsa and their tools are on it. -->
<busconfig>
  <type>system</type>
  <listen>unix:path=/var/run/dbus/system_bus_socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow user="*"/>
    <allow own="*"/>
    <allow send_destination="*"/>
    <allow receive_sender="*"/>
  </policy>
  <!-- A desktop's limits (up to 127 MB queued per connection) on a 23 MB H2:
       a client that stops reading could take the memory the music needs.
       BlueZ's and bluez-alsa's messages are a few KB; the bus has a handful
       of clients (bluetoothd, bluealsa, fathom-avrcp, bluealsa-cli,
       bluetoothctl). -->
  <limit name="max_incoming_bytes">1048576</limit>
  <limit name="max_outgoing_bytes">1048576</limit>
  <limit name="max_message_size">262144</limit>
  <limit name="max_incoming_unix_fds">64</limit>
  <limit name="max_outgoing_unix_fds">64</limit>
  <limit name="max_message_unix_fds">16</limit>
  <limit name="max_completed_connections">32</limit>
  <limit name="max_incomplete_connections">8</limit>
  <limit name="max_connections_per_user">32</limit>
  <limit name="max_pending_service_starts">8</limit>
  <limit name="max_names_per_connection">32</limit>
  <limit name="max_match_rules_per_connection">256</limit>
  <limit name="max_replies_per_connection">128</limit>
</busconfig>
